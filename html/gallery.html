<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display:grid;
            gap: 0.8rem;
            padding: 10%;
            /* grid-template-columns:30% 20% 10%;
            grid-template-columns:repeat(5, 20%); */
            grid-template-columns:1fr 1fr 1fr;
            grid-template-rows: repeat(4, 200px);
            grid-template-areas: 
                "img1 img2 img3"
                "img1 img2 img6"
                "img4 img2 img6"
                "img4 img5 img5";
        }
        .container:hover img:not(:hover){filter:grayscale(1);opacity:0.5;}

        img{width:100%;height:100%;object-fit:cover;border-radius:.6rem;}
        .img1{grid-area: img1;}
        .img2{grid-area: img2;}
        .img3{grid-area: img3;}
        .img4{grid-area: img4;}
        .img5{grid-area: img5;}
        .img6{grid-area: img6;}
    </style>
</head>
<body>
