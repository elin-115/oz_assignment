<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM & Event</title>
    <style>
        .mt20{margin-top:20px;}
        span{
            background-color: #880f7e;
            padding: 5px;
            color:#fff;
        }
    </style>
</head>
<body>
    <h1 id="msg">Hello, DOM & Event</h1>
    <div>
        <button type="button" class="btn_g">눌러보세요</button>
        <script>
            // const btn = document.querySelector("button")
            const btn = document.querySelector(".btn_g")

            function buttonAlert() {
                alert("버튼이 클릭됨")
            }

            // 이벤트 리스너(Event Listener)
            // -> 특정 이벤트가 발생했을 때 실행할 함수
            btn.addEventListener("click", buttonAlert)

            btn.addEventListener(
                "click", 
                () => alert("버튼이 클릭됨")    // 코드가 한줄이면 이렇게 해도 됨
            )
            btn.addEventListener(
                "click", 
                () => {
                    alert("버튼이 클릭됨")
                }
            )
        </script>
    </div>
    <div class="mt20">
        <h3>이름 입력</h3>
        <input type="text" id="name-input">
        <button type="button" id="" class="btn_check">확인</button>

        <script>
            const input = document.querySelector("#name-input")
            const btn_check = document.querySelector(".btn_check")

            const p = document.createElement("p");
            btn_check.addEventListener(
                "click",
                () => {
                    if (input.value === "") {
                        alert("이름을 입력하세요.");
                        return
                    } 

                    p.textContent = input.value;
                    document.body.appendChild(p);
                    input.value = "";
                }
            )
        </script>
    </div>
    <div class="mt20">
        <h3>input 태스에 이벤트가 발생할때마다 이벤트</h3>        
        <input type="password" id="pw-input" placeholder="비밀번호 입력">
        <button type="button" class="btn_check">확인</button>
        <p id="txt_help"></p>
        <script>
            const inp_pw = document.querySelector("#pw-input")
            const txt_help = document.querySelector("#txt_help")
            inp_pw.addEventListener(
                "click",
                () => {
                    // 비밀번호 검사
                    if (input.value.length < 4){
                        txt_help.textContent = "4자리 이상 입력하세요.";
                        txt_help.style.color = "red";
                    } else {
                        txt_help.textContent = "사용 가능한 비민번호 입니다.";
                        txt_help.style.color = "green";
                    }
                }
            )
        </script>
    </div>
    <div class="mt20">
        <h3>마우스 이벤트</h3>

        <span>마우스를 올려보세요.</span>
        <script>
            const span = document.querySelector("span")
            function changeColor(color){
                span.style.backgroundColor = color;

            }

            span.addEventListener(
                "mouseover", () => changeColor("#003c82")
            );
            span.addEventListener(
                "mouseout", () => changeColor("#880f7e")
            );
        </script>
    </div>
</body>
</html>
