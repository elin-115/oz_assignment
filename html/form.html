<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <style>
        label, input, button{display:inline-block;vertical-align:top;margin-top:10px;}
        label{width:80px;}
    </style>
</head>
<body>
    <!-- GET -->
    <form action="https://google.com/search">
        <input type="search" name="q">
        <button type="submit">전송</button>
    </form>

    <!-- POST -->
    <form action="https://httpbin.org/post" method="post">
        <label for="newEmail">이메일</label>
        <input type="email" id="newEmail" name="newEmail" placeholder="aa@gmail.com">
        <br>

        <label for="newPassword">비밀번호</label>
        <input type="password" id="newPassword" name="newPassword" placeholder="8자리 암호">
        <br>
        
        <button type="submit">회원가입</button>
    </form>
</body>
</html>
