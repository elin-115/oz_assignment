<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>
<body>
    <!-- 가로 : 행 = row (record) -->
    <!-- 세로 : 열 = col (column, field) -->
    <table border="1">
        <thead>
            <tr>
                <th>id</th>
                <th>name</th>
                <th>email</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>alex</td>
                <td>alex@example.com</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
