<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>사칙연산 계산기</title>
    <script src="../js/caculator.js"></script>
</head>
<body>
    <h1>콘솔창 계산기 프로그램</h1>

    <ul>
        <li>4칙연산에 대한 계산이 가능</li>
        <li>길이가 긴 계산식도 계산이 가능</li>
        <li>사칙연산 우선순위( * , /  가 +, - 보다 먼저 계산됨)가 적용</li>
    </ul>

    <h3>Window OS의 경우</h3>
    <hr>
    <p>1. F12 키를 눌러 콘솔 창을 여세요.</p>
    <p>2. start()를 콘솔창에 입력하여 계산기를 실행합니다.</p>
    <h3>Mac OS의 경우</h3>
    <hr>
    <p>1. Option + Command + i 키를 눌러 콘솔 창을 여세요.</p>
    <p>2. start()를 콘솔창에 입력하여 계산기를 실행합니다.</p>
</body>
</html>
